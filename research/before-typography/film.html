<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 替你办事，权限谁说了算？</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d10;color:#eee;font-family:"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);background:#0c1519}#controls{position:fixed;right:16px;top:15px;display:flex;gap:7px;z-index:4;opacity:.2;transition:opacity .2s}body:hover #controls,#controls:focus-within{opacity:1}button{border:1px solid #ffffff30;background:#142128df;color:#dce8e3;padding:8px 12px;border-radius:4px;cursor:pointer;font:12px inherit}button:hover{border-color:#a8f0bc}#sound.blocked{opacity:1;color:#c9f5d4}#status{position:fixed;inset:0;display:grid;place-items:center;background:#0c1519;color:#b6dbc7;font-size:16px;z-index:5}#seek{position:fixed;bottom:0;left:0;width:100%;height:7px;opacity:0;cursor:pointer;margin:0;accent-color:#9deaaf}body:hover #seek,#seek:focus{opacity:.8}video{position:fixed;width:2px;height:2px;opacity:.001;pointer-events:none;left:0;top:0}

<video id="muse" src="assets/video_meta-meta_muse_shopping_context.mp4" preload="auto" muted playsinline></video>

</body></html>
