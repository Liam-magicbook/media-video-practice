<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 的数学稿，Lean 检查了什么？</title>
<style>
  :root{--bg:#080c0d;--line:#2a3230;--ink:#f5f2e8;--muted:#98a19d;--green:#7fe3a8;--red:#e0523a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
  #stage{width:min(100%,1680px);aspect-ratio:16/9;position:relative;background:#000;box-shadow:0 24px 80px #000a;border:1px solid #1d2523}
  canvas{width:100%;height:100%;display:block}
  #status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:15px;letter-spacing:.04em;background:#080c0d}
  .bar{width:min(100%,1680px);display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
  button{appearance:none;border:1px solid #35403c;background:#111817;color:#e9e6dc;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer}
  button:hover{border-color:#5d6a65;color:#fff}
  #sound{border-color:#2f6b4b;color:#b9f0cd}
  input[type=range]{flex:1;accent-color:#7fe3a8;cursor:pointer}
  .hint{opacity:.6;font-size:12px;white-space:nowrap}
  #clock{font-family:"SF Mono",Menlo,monospace;font-size:12px;color:#a8b2ad;min-width:132px;text-align:right}
  @media (max-width:720px){.hint{display:none}button{padding:6px 10px;font-size:12px}}
  body.shot{padding:0;display:block;background:#000}
  body.shot #stage{border:0;box-shadow:none;max-width:none}
  body.shot .bar{display:none}
</style>
</head>
<body>
<div id="stage">
  <canvas id="film" width="1920" height="1080"></canvas>
  <div id="status">正在载入素材…</div>
</div>
<div class="bar">
  <button id="pause">暂停</button>
  <button id="replay">重播</button>
  <button id="sound">开启旁白</button>
  <span id="clock">00:00.0 / 01:47.4</span>
  <input id="seek" type="range" min="0" max="107.5" step="0.05" value="0">
  <button id="full">全屏</button>
  <span class="hint">空格 播放/暂停 · ←/→ 5 秒</span>
</div>
<video id="lean" src="assets/lean-demo.mp4" muted playsinline preload="auto" style="position:absolute;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<video id="smf" src="assets/smf-talk.mp4" muted playsinline preload="auto" style="position:absolute;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none"></video>
<audio id="voice" src="narration.wav" preload="auto"></audio>
<script src="timeline.js"></script>
<script src="craft.js"></script>
<script src="film.js"></script>
</body>
</html>
